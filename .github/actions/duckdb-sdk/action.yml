name: Patched DuckDB SDK
description: Build and cache the pinned DuckDB engine with repository patches
runs:
  using: composite
  steps:
    - name: Install SDK build tools
      shell: bash
      run: |
        set -euo pipefail
        if [[ "$RUNNER_OS" == Linux ]]; then
          if [[ "$(id -u)" == 0 ]]; then
            privilege=()
          else
            privilege=(sudo)
          fi
          "${privilege[@]}" apt-get update
          "${privilege[@]}" apt-get install -y build-essential cmake python3 curl patch ca-certificates
        else
          command -v cmake
          command -v python3
        fi
        if [[ ! -w /opt ]]; then
          sudo mkdir -p /opt/duckdb
          sudo chown "$(id -u):$(id -g)" /opt/duckdb
        else
          mkdir -p /opt/duckdb
        fi

    - name: Test SDK cache metadata and artifact validation
      shell: bash
      run: python3 packaging/duckdb/tests/test_sdk_cache.py

    - name: Compute SDK build fingerprint
      id: fingerprint
      shell: bash
      run: |
        set -euo pipefail
        fingerprint=$(bash packaging/duckdb/build-sdk.sh --fingerprint)
        if [[ ! "$fingerprint" =~ ^[a-f0-9]{64}$ ]]; then
          echo "Invalid DuckDB SDK build fingerprint" >&2
          exit 1
        fi

        echo "key=duckdb-patched-v2-${RUNNER_OS}-${RUNNER_ARCH}-$fingerprint" >> "$GITHUB_OUTPUT"

    - name: Restore SDK cache
      id: cache
      uses: actions/cache/restore@v4
      with:
        path: /opt/duckdb
        key: ${{ steps.fingerprint.outputs.key }}

    - name: Build or verify SDK
      shell: bash
      run: |
        bash packaging/duckdb/build-sdk.sh \
          --prefix /opt/duckdb --work-dir "${RUNNER_TEMP}/duckdb-sdk-build"

    # Persist the verified SDK before later extension builds or tests can fail.
    - name: Save SDK cache
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: /opt/duckdb
        key: ${{ steps.fingerprint.outputs.key }}
