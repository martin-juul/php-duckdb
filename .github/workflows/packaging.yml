name: Packaging

# Keeps the distribution packaging in packaging/ buildable. Each job
# builds the native package in a real distro container (openSUSE
# Tumbleweed, Fedora 44, AlmaLinux 9/10 against the Remi repository's
# PHP, Amazon Linux 2023/2027 preview, Debian sid, Debian 13 trixie,
# Ubuntu LTS and Ubuntu devel), runs the
# full test suite at build time, then installs the resulting package and
# smoke-tests the system PHP loading it through the distro's own ini
# mechanism. macOS has no such mechanism, so its job ships tarballs
# (duckdb.so + vendored libduckdb.dylib + install script) built natively
# on macos-15-intel and macos-15, targeting macOS 12+. Windows ships
# x64 ZIPs for PHP 8.2–8.5 TS/NTS with the matching DuckDB runtime DLL.
#
# Every Linux job runs on amd64 (ubuntu-latest) AND arm64
# (ubuntu-24.04-arm — native ARM64 runners, free for public repos), so
# each distro package is built and smoke-tested on both architectures.
#
# When a GitHub Release is published, all packages are rebuilt from the
# release tag and attached to the release as downloadable assets by the
# final release-assets job (which runs only for release events).

on:
  push:
    branches: [master]
    paths:
      - 'packaging/**'
      - 'config.m4'
      - 'config.w32'
      - 'duckdb.cpp'
      - 'php_duckdb.h'
      - 'duckdb_arginfo.h'
      - 'duckdb.stub.php'
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/packaging.yml'
      - '.github/actions/duckdb-sdk-cache/**'
      - '.github/scripts/sdk-cache-key.py'
      - '.github/tests/test_sdk_cache_key.py'
  pull_request:
    paths:
      - 'packaging/**'
      - 'config.m4'
      - 'config.w32'
      - 'duckdb.cpp'
      - 'php_duckdb.h'
      - 'duckdb_arginfo.h'
      - 'duckdb.stub.php'
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/packaging.yml'
      - '.github/actions/duckdb-sdk-cache/**'
      - '.github/scripts/sdk-cache-key.py'
      - '.github/tests/test_sdk_cache_key.py'
  release:
    types: [published]

jobs:
  sdk-cache-tests:
    name: SDK cache contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/tests/test_sdk_cache_key.py
      - run: python3 -m unittest discover -s packaging/duckdb/tests -p 'test_*.py'
      - run: pwsh -NoProfile -File packaging/duckdb/tests/test_cache.ps1

  opensuse-rpm:
    needs: sdk-cache-tests
    name: openSUSE Tumbleweed RPM (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    container: opensuse/tumbleweed:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tooling
        run: |
          set -eu
          # Some Tumbleweed mirrors serve stale RPMs even after refreshing
          # metadata. Use the origin while preserving architecture paths
          # and normal package signature/checksum verification.
          sed -i 's|http[s]*://download\.opensuse\.org/|https://downloadcontent.opensuse.org/|g' \
            /etc/zypp/repos.d/*.repo
          zypper --non-interactive --gpg-auto-import-keys refresh
          for attempt in 1 2 3; do
            # The container image can be newer than the rolling repository.
            # Allow the solver to align installed dependencies with available
            # development packages (for example PCRE2 runtime and headers).
            if zypper --non-interactive install --no-recommends --allow-downgrade \
              rpm-build php8 php8-devel gcc gcc-c++ make autoconf automake \
              chrpath cmake python3 patch curl tar gzip gawk; then
              break
            else
              status=$?
            fi
            # Tumbleweed mirrors can serve mismatched metadata/packages
            # during updates. Retry transaction failures with fresh caches;
            # never bypass package signature or checksum verification.
            if [ "$status" -ne 8 ] || [ "$attempt" -eq 3 ]; then
              exit "$status"
            fi
            echo "Zypper transaction failed; refreshing caches before retry $((attempt + 1))/3"
            zypper --non-interactive clean --all
            sleep 15
            zypper --non-interactive --gpg-auto-import-keys refresh --force
          done

      # Stage both pinned source archives; rpmbuild performs an offline engine build.
      # Pack the checkout directly because REST checkout may not provide .git.
      - name: Stage rpmbuild sources
        run: |
          set -eu
          ver=$(awk '/^Version:/ {print $2}' packaging/opensuse/php-duckdb.spec)
          dver=$(python3 -c 'import json; print(json.load(open("packaging/duckdb/source.json"))["version"])')
          source_url=$(python3 -c 'import json; print(json.load(open("packaging/duckdb/source.json"))["url"])')
          mkdir -p /root/rpmbuild/SOURCES /root/rpmbuild/SPECS /root/rpmbuild/BUILD /root/rpmbuild/RPMS /root/rpmbuild/SRPMS
          tar --exclude='./.git' --transform "s,^\.,php-duckdb-${ver}," \
            -czf "/root/rpmbuild/SOURCES/php-duckdb-${ver}.tar.gz" .
          curl -fsSL --retry 4 --retry-all-errors --retry-max-time 300 \
            --connect-timeout 20 --max-time 180 -o "/root/rpmbuild/SOURCES/duckdb-${dver}.tar.gz" \
            "$source_url"
          cp packaging/opensuse/php-duckdb.spec /root/rpmbuild/SPECS/

      # -ba builds the binary RPMs AND the SRPM; the spec's %check runs
      # the full .phpt suite (Swoole/AMPHP/ReactPHP/True-Async tests skip
      # — those extensions are not installed here).
      - name: Restore verified DuckDB SDK artifacts
        id: sdk-cache
        uses: ./.github/actions/duckdb-sdk-cache
        with:
          target: opensuse

      - name: Build RPM (with test suite)
        run: rpmbuild --define '_topdir /root/rpmbuild' -ba /root/rpmbuild/SPECS/php-duckdb.spec

      - name: Save completed DuckDB SDK artifacts
        if: ${{ !cancelled() && steps.sdk-cache.outputs.key != '' && steps.sdk-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.sdk-cache.outputs.path }}
          key: ${{ steps.sdk-cache.outputs.key }}

      - name: Install RPM and smoke test with system PHP
        run: |
          set -eu
          rpm -ivh /root/rpmbuild/RPMS/$(uname -m)/php8-duckdb-*.rpm
          php -m | grep -i duckdb
          php -r '$c = (new DuckDB\Database())->connect(); $r = $c->query("SELECT 42 AS x")->fetchRow(); if ($r["x"] !== 42) { exit(1); } printf("smoke OK: duckdb ext %s, libduckdb %s, PHP %s\n", phpversion("duckdb"), DuckDB\version(), PHP_VERSION);'

      - name: Upload RPM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opensuse-tumbleweed-rpm-${{ matrix.arch }}
          path: |
            /root/rpmbuild/RPMS/*/*.rpm
            /root/rpmbuild/SRPMS/*.rpm
          if-no-files-found: error

  fedora-rpm:
    needs: sdk-cache-tests
    name: Fedora 44 RPM (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    container: fedora:44
    steps:
      - uses: actions/checkout@v4

      - name: Install build tooling
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            rpm-build php-devel php-cli gcc gcc-c++ make libtool chrpath \
            cmake python3 patch curl tar gzip gawk

      # Stage source archives for the offline engine and extension build.
      - name: Stage rpmbuild sources
        run: |
          set -eu
          ver=$(awk '/^%global upstream_version/ {print $3}' packaging/fedora/php-pecl-duckdb.spec)
          dver=$(python3 -c 'import json; print(json.load(open("packaging/duckdb/source.json"))["version"])')
          source_url=$(python3 -c 'import json; print(json.load(open("packaging/duckdb/source.json"))["url"])')
          mkdir -p /root/rpmbuild/SOURCES /root/rpmbuild/SPECS /root/rpmbuild/BUILD /root/rpmbuild/RPMS /root/rpmbuild/SRPMS
          tar --exclude='./.git' --transform "s,^\.,php-duckdb-${ver}," \
            -czf "/root/rpmbuild/SOURCES/php-duckdb-${ver}.tar.gz" .
          curl -fsSL --retry 4 --retry-all-errors --retry-max-time 300 \
            --connect-timeout 20 --max-time 180 -o "/root/rpmbuild/SOURCES/duckdb-${dver}.tar.gz" \
            "$source_url"
          cp packaging/fedora/php-pecl-duckdb.spec /root/rpmbuild/SPECS/

      # -ba builds the binary RPMs AND the SRPM; the spec's %check runs
      # the full .phpt suite (Swoole/AMPHP/ReactPHP/True-Async tests skip
      # — those extensions are not installed here).
      - name: Restore verified DuckDB SDK artifacts
        id: sdk-cache
        uses: ./.github/actions/duckdb-sdk-cache
        with:
          target: fedora

      - name: Build RPM (with test suite)
        run: rpmbuild --define '_topdir /root/rpmbuild' -ba /root/rpmbuild/SPECS/php-pecl-duckdb.spec

      - name: Save completed DuckDB SDK artifacts
        if: ${{ !cancelled() && steps.sdk-cache.outputs.key != '' && steps.sdk-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.sdk-cache.outputs.path }}
          key: ${{ steps.sdk-cache.outputs.key }}

      - name: Install RPM and smoke test with system PHP
        run: |
          set -eu
          rpm -ivh /root/rpmbuild/RPMS/$(uname -m)/php-pecl-duckdb-*.rpm
          php -m | grep -i duckdb
          php -r '$c = (new DuckDB\Database())->connect(); $r = $c->query("SELECT 42 AS x")->fetchRow(); if ($r["x"] !== 42) { exit(1); } printf("smoke OK: duckdb ext %s, libduckdb %s, PHP %s\n", phpversion("duckdb"), DuckDB\version(), PHP_VERSION);'

      - name: Upload RPM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fedora-44-rpm-${{ matrix.arch }}
          path: |
            /root/rpmbuild/RPMS/*/*.rpm
            /root/rpmbuild/SRPMS/*.rpm
          if-no-files-found: error

  amazonlinux-rpm:
    needs: sdk-cache-tests
    name: Amazon Linux ${{ matrix.os }} PHP ${{ matrix.php }} RPM (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: ['2023', '2027']
        php: ['8.2', '8.3', '8.4', '8.5']
        arch: [amd64, arm64]
        exclude:
          # AL2027 is a public preview and currently supplies only PHP 8.5.
          - os: '2027'
            php: '8.2'
          - os: '2027'
            php: '8.3'
          - os: '2027'
            php: '8.4'
    container: public.ecr.aws/amazonlinux/amazonlinux:${{ matrix.os }}
    steps:
      - name: Install checkout prerequisites
        run: dnf install -y --setopt=install_weak_deps=False tar gzip git

      - uses: actions/checkout@v4

      - name: Install build tooling
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            rpm-build php${{ matrix.php }}-devel php${{ matrix.php }}-cli \
            php${{ matrix.php }}-ffi gcc gcc-c++ make libtool autoconf \
            cmake python3 patch tar gzip gawk patchelf findutils
          php -v

      # curl-minimal from the base image satisfies downloads without a full-curl conflict.
      # Stage source archives for the offline engine and extension build.
      - name: Stage rpmbuild sources
        run: |
          set -eu
          ver=$(awk '/^%global upstream_version/ {print $3}' packaging/amazonlinux/php-pecl-duckdb.spec)
          dver=$(python3 -c 'import json; print(json.load(open("packaging/duckdb/source.json"))["version"])')
          source_url=$(python3 -c 'import json; print(json.load(open("packaging/duckdb/source.json"))["url"])')
          mkdir -p /root/rpmbuild/SOURCES /root/rpmbuild/SPECS /root/rpmbuild/BUILD /root/rpmbuild/RPMS /root/rpmbuild/SRPMS
          tar --exclude='./.git' --transform "s,^\.,php-duckdb-${ver}," \
            -czf "/root/rpmbuild/SOURCES/php-duckdb-${ver}.tar.gz" .
          curl -fsSL --retry 4 --retry-all-errors --retry-max-time 300 \
            --connect-timeout 20 --max-time 180 -o "/root/rpmbuild/SOURCES/duckdb-${dver}.tar.gz" \
            "$source_url"
          cp packaging/amazonlinux/php-pecl-duckdb.spec /root/rpmbuild/SPECS/

      # -ba builds the binary RPMs AND the SRPM; the spec's %check runs
      # the full .phpt suite (Swoole/AMPHP/ReactPHP/True-Async tests skip
      # — those extensions are not installed here).
      - name: Restore verified DuckDB SDK artifacts
        id: sdk-cache
        uses: ./.github/actions/duckdb-sdk-cache
        with:
          target: amazonlinux

      - name: Build RPM (with test suite)
        run: rpmbuild --define '_topdir /root/rpmbuild' --define 'php_slot ${{ matrix.php }}' -ba /root/rpmbuild/SPECS/php-pecl-duckdb.spec

      - name: Save completed DuckDB SDK artifacts
        if: ${{ !cancelled() && steps.sdk-cache.outputs.key != '' && steps.sdk-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.sdk-cache.outputs.path }}
          key: ${{ steps.sdk-cache.outputs.key }}

      - name: Install RPM and smoke test with system PHP
        run: |
          set -eu
          rpm -ivh /root/rpmbuild/RPMS/$(uname -m)/php-pecl-duckdb-*.rpm
          module="$(php-config --extension-dir)/duckdb.so"
          readelf -d "$module" | grep -F 'libphp-duckdb-engine.so'
          ldd "$module" | grep -F '/php-duckdb/libphp-duckdb-engine.so'
          php -m | grep -i duckdb
          # RPM 6 cleans BUILD after success; the CI checkout remains available.
          php packaging/smoke.php

      - name: Upload RPM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: amazonlinux-${{ matrix.os }}-php${{ matrix.php }}-rpm-${{ matrix.arch }}
          path: |
            /root/rpmbuild/RPMS/*/*.rpm
            /root/rpmbuild/SRPMS/*.rpm
          if-no-files-found: error


  almalinux-rpm:
    needs: sdk-cache-tests
    name: AlmaLinux ${{ matrix.os }} RPM — Remi PHP ${{ matrix.php }} (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: ['9', '10']
        php: ['8.2', '8.3', '8.4', '8.5']
        arch: [amd64, arm64]
    container: almalinux:${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Remi's default-namespace PHP via the remi-8.x php module streams
      # from the remi-modular repo (enabled by default in remi-release).
      # This is Remi's documented EL flow; the legacy dedicated
      # remi-php82/83/84/85 repos no longer ship in remi-release.
      # Resetting the php module first drops any AppStream default
      # stream (EL9's php:8.2), so the remi stream wins; the reset is
      # tolerated to fail where no distribution php module exists.
      # After the stream switch, plain php-devel/php-cli resolve from it.
      # --allowerasing lets dnf swap the container's curl-minimal for the
      # full curl package (the two conflict; AlmaLinux base images ship
      # curl-minimal).
      - name: Install Remi repository and build tooling
        run: |
          set -eu
          dnf install -y --setopt=install_weak_deps=False epel-release
          dnf install -y "https://rpms.remirepo.net/enterprise/remi-release-${{ matrix.os }}.rpm"
          dnf module reset -y php 2>/dev/null || true
          dnf module install -y "php:remi-${{ matrix.php }}/common"
          dnf install -y --setopt=install_weak_deps=False --allowerasing \
            php-devel php-cli \
            rpm-build gcc gcc-c++ make libtool chrpath cmake python3 patch curl tar gzip gawk
          php -v | head -1

      # Stage source archives for the offline engine and extension build.
      - name: Stage rpmbuild sources
        run: |
          set -eu
          ver=$(awk '/^%global upstream_version/ {print $3}' packaging/almalinux/php-pecl-duckdb.spec)
          dver=$(python3 -c 'import json; print(json.load(open("packaging/duckdb/source.json"))["version"])')
          source_url=$(python3 -c 'import json; print(json.load(open("packaging/duckdb/source.json"))["url"])')
          mkdir -p /root/rpmbuild/SOURCES /root/rpmbuild/SPECS /root/rpmbuild/BUILD /root/rpmbuild/RPMS /root/rpmbuild/SRPMS
          tar --exclude='./.git' --transform "s,^\.,php-duckdb-${ver}," \
            -czf "/root/rpmbuild/SOURCES/php-duckdb-${ver}.tar.gz" .
          curl -fsSL --retry 4 --retry-all-errors --retry-max-time 300 \
            --connect-timeout 20 --max-time 180 -o "/root/rpmbuild/SOURCES/duckdb-${dver}.tar.gz" \
            "$source_url"
          cp packaging/almalinux/php-pecl-duckdb.spec /root/rpmbuild/SPECS/

      # -bb builds the binary RPM only: this 16-cell matrix would
      # otherwise publish 8 identical SRPMs per distro version.
      # The spec's %check runs the full .phpt suite (Swoole/AMPHP/
      # ReactPHP/True-Async tests skip — those extensions are not
      # installed here).
      - name: Restore verified DuckDB SDK artifacts
        id: sdk-cache
        uses: ./.github/actions/duckdb-sdk-cache
        with:
          target: almalinux

      - name: Build RPM (with test suite)
        run: rpmbuild --define '_topdir /root/rpmbuild' -bb /root/rpmbuild/SPECS/php-pecl-duckdb.spec

      - name: Save completed DuckDB SDK artifacts
        if: ${{ !cancelled() && steps.sdk-cache.outputs.key != '' && steps.sdk-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.sdk-cache.outputs.path }}
          key: ${{ steps.sdk-cache.outputs.key }}

      - name: Install RPM and smoke test with Remi PHP
        run: |
          set -eu
          rpm -ivh /root/rpmbuild/RPMS/$(uname -m)/php-pecl-duckdb-*.rpm
          php -m | grep -i duckdb
          php -r '$c = (new DuckDB\Database())->connect(); $r = $c->query("SELECT 42 AS x")->fetchRow(); if ($r["x"] !== 42) { exit(1); } printf("smoke OK: duckdb ext %s, libduckdb %s, PHP %s\n", phpversion("duckdb"), DuckDB\version(), PHP_VERSION);'

      - name: Upload RPM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: almalinux-${{ matrix.os }}-php${{ matrix.php }}-rpm-${{ matrix.arch }}
          path: /root/rpmbuild/RPMS/*/*.rpm
          if-no-files-found: error

  debian-deb:
    needs: sdk-cache-tests
    name: Debian sid deb (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    container: debian:sid
    steps:
      - uses: actions/checkout@v4

      # Build the pinned patched SDK independently of distribution DuckDB.
      - name: Install build tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential debhelper dh-php php-dev php-cli \
            curl cmake python3 patch patchelf ca-certificates

      # Same guard as the Fedora spec's %prep check: the changelog
      # version and PHP_DUCKDB_VERSION must not drift apart.
      - name: Guard version drift
        run: |
          set -eu
          code_ver=$(sed -n '/PHP_DUCKDB_VERSION/{s/.* "//;s/".*$//;p}' php_duckdb.h)
          deb_ver=$(dpkg-parsechangelog -l packaging/debian/changelog -S Version)
          deb_ver=${deb_ver%%-*}
          if [ "$code_ver" != "$deb_ver" ]; then
            echo "version drift: php_duckdb.h=$code_ver debian/changelog=$deb_ver"
            exit 1
          fi

      # dpkg insists on ./debian at the source root; copy it out of
      # packaging/ and restore the execute bit on debian/rules.
      - name: Stage debian packaging and engine source
        run: |
          set -eu
          cp -a "$GITHUB_WORKSPACE" /root/src
          cp -r /root/src/packaging/debian /root/src/debian
          chmod +x /root/src/debian/rules
          source_url=$(python3 -c 'import json; print(json.load(open("/root/src/packaging/duckdb/source.json"))["url"])')
          curl -fsSL --retry 4 --retry-all-errors --retry-max-time 300 \
            --connect-timeout 20 --max-time 180 -o /root/src/duckdb-source.tar.gz \
            "$source_url"

      # dpkg-buildpackage -b builds the binary debs (landing next to the
      # source tree); dh_auto_test runs the full .phpt suite with
      # NO_INTERACTION=1 / REPORT_EXIT_STATUS=1 from debian/rules
      # (Swoole/AMPHP/ReactPHP/True-Async tests skip — those extensions
      # are not installed here).
      - name: Restore verified DuckDB SDK artifacts
        id: sdk-cache
        uses: ./.github/actions/duckdb-sdk-cache
        with:
          target: debian

      - name: Build deb (with test suite)
        run: cd /root/src && dpkg-buildpackage -us -uc -b

      - name: Save completed DuckDB SDK artifacts
        if: ${{ !cancelled() && steps.sdk-cache.outputs.key != '' && steps.sdk-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.sdk-cache.outputs.path }}
          key: ${{ steps.sdk-cache.outputs.key }}

      - name: Install deb and smoke test with system PHP
        run: |
          set -eu
          dpkg -i /root/php-duckdb_*.deb
          module="$(php-config --extension-dir)/duckdb.so"
          readelf -d "$module" | grep -F 'libphp-duckdb-engine.so'
          ldd "$module" | grep -F '/php-duckdb/libphp-duckdb-engine.so'
          php -m | grep -i duckdb
          php /root/src/packaging/smoke.php

      - name: Upload deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debian-sid-deb-${{ matrix.arch }}
          path: /root/php-duckdb*.deb
          if-no-files-found: error


  debian-trixie-deb:
    needs: sdk-cache-tests
    name: Debian 13 trixie deb (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4

      # trixie has no libduckdb package (DuckDB entered Debian after the
      # freeze), so this job builds and vendors the patched source SDK.
      # sid and Ubuntu jobs also build the pinned patched source SDK.
      - name: Install build tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential debhelper dh-php php-dev php-cli \
            curl cmake python3 patch ca-certificates

      - name: Guard version drift
        run: |
          set -eu
          code_ver=$(sed -n '/PHP_DUCKDB_VERSION/{s/.* "//;s/".*$//;p}' php_duckdb.h)
          deb_ver=$(dpkg-parsechangelog -l packaging/debian-trixie/changelog -S Version)
          deb_ver=${deb_ver%%-*}
          if [ "$code_ver" != "$deb_ver" ]; then
            echo "version drift: php_duckdb.h=$code_ver debian-trixie/changelog=$deb_ver"
            exit 1
          fi

      # Stage the pinned archive. debian/rules builds the patched SDK offline
      # with the distribution's compiler flags before building the extension.
      - name: Stage debian packaging and engine source
        run: |
          set -eu
          cp -a "$GITHUB_WORKSPACE" /root/src
          cp -r /root/src/packaging/debian-trixie /root/src/debian
          chmod +x /root/src/debian/rules
          source_url=$(python3 -c 'import json; print(json.load(open("/root/src/packaging/duckdb/source.json"))["url"])')
          curl -fsSL --retry 4 --retry-all-errors --retry-max-time 300 \
            --connect-timeout 20 --max-time 180 -o /root/src/duckdb-source.tar.gz \
            "$source_url"

      # dpkg-buildpackage -b builds the binary debs (landing next to the
      # source tree); dh_auto_test runs the full .phpt suite with
      # NO_INTERACTION=1 / REPORT_EXIT_STATUS=1 from debian/rules, with
      # LD_LIBRARY_PATH pointed at the staged duckdb-sdk/lib
      # (Swoole/AMPHP/ReactPHP/True-Async tests skip — those extensions
      # are not installed here).
      - name: Restore verified DuckDB SDK artifacts
        id: sdk-cache
        uses: ./.github/actions/duckdb-sdk-cache
        with:
          target: debian-trixie

      - name: Build deb (with test suite)
        run: cd /root/src && dpkg-buildpackage -us -uc -b

      - name: Save completed DuckDB SDK artifacts
        if: ${{ !cancelled() && steps.sdk-cache.outputs.key != '' && steps.sdk-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.sdk-cache.outputs.path }}
          key: ${{ steps.sdk-cache.outputs.key }}

      - name: Install deb and smoke test with system PHP
        run: |
          set -eu
          dpkg -i /root/php-duckdb_*.deb
          php -m | grep -i duckdb
          php -r '$c = (new DuckDB\Database())->connect(); $r = $c->query("SELECT 42 AS x")->fetchRow(); if ($r["x"] !== 42) { exit(1); } printf("smoke OK: duckdb ext %s, libduckdb %s, PHP %s\n", phpversion("duckdb"), DuckDB\version(), PHP_VERSION);'

      - name: Upload deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debian-13-trixie-deb-${{ matrix.arch }}
          path: /root/php-duckdb*.deb
          if-no-files-found: error

  ubuntu-lts-deb:
    needs: sdk-cache-tests
    name: Ubuntu ${{ matrix.release }} LTS deb (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        # noble: PHP 8.3, resolute: PHP 8.5; both build the patched SDK.
        release: ['24.04', '26.04']
        arch: [amd64, arm64]
    container: ubuntu:${{ matrix.release }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential debhelper dh-php php-dev php-cli \
            curl cmake python3 patch ca-certificates

      - name: Guard version drift
        run: |
          set -eu
          code_ver=$(sed -n '/PHP_DUCKDB_VERSION/{s/.* "//;s/".*$//;p}' php_duckdb.h)
          deb_ver=$(dpkg-parsechangelog -l packaging/ubuntu/changelog -S Version)
          deb_ver=${deb_ver%%-*}
          if [ "$code_ver" != "$deb_ver" ]; then
            echo "version drift: php_duckdb.h=$code_ver ubuntu/changelog=$deb_ver"
            exit 1
          fi

      # Stage the pinned archive. debian/rules builds the patched SDK offline
      # with the distribution's compiler flags before building the extension.
      - name: Stage debian packaging and engine source
        run: |
          set -eu
          cp -a "$GITHUB_WORKSPACE" /root/src
          cp -r /root/src/packaging/ubuntu /root/src/debian
          chmod +x /root/src/debian/rules
          source_url=$(python3 -c 'import json; print(json.load(open("/root/src/packaging/duckdb/source.json"))["url"])')
          curl -fsSL --retry 4 --retry-all-errors --retry-max-time 300 \
            --connect-timeout 20 --max-time 180 -o /root/src/duckdb-source.tar.gz \
            "$source_url"

      # dpkg-buildpackage -b builds the binary debs (landing next to the
      # source tree); dh_auto_test runs the full .phpt suite with
      # NO_INTERACTION=1 / REPORT_EXIT_STATUS=1 from debian/rules, with
      # LD_LIBRARY_PATH pointed at the staged duckdb-sdk/lib
      # (Swoole/AMPHP/ReactPHP/True-Async tests skip — those extensions
      # are not installed here).
      - name: Restore verified DuckDB SDK artifacts
        id: sdk-cache
        uses: ./.github/actions/duckdb-sdk-cache
        with:
          target: ubuntu

      - name: Build deb (with test suite)
        run: cd /root/src && dpkg-buildpackage -us -uc -b

      - name: Save completed DuckDB SDK artifacts
        if: ${{ !cancelled() && steps.sdk-cache.outputs.key != '' && steps.sdk-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.sdk-cache.outputs.path }}
          key: ${{ steps.sdk-cache.outputs.key }}

      - name: Install deb and smoke test with system PHP
        run: |
          set -eu
          dpkg -i /root/php-duckdb_*.deb
          php -m | grep -i duckdb
          php -r '$c = (new DuckDB\Database())->connect(); $r = $c->query("SELECT 42 AS x")->fetchRow(); if ($r["x"] !== 42) { exit(1); } printf("smoke OK: duckdb ext %s, libduckdb %s, PHP %s\n", phpversion("duckdb"), DuckDB\version(), PHP_VERSION);'

      - name: Upload deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-${{ matrix.release }}-deb-${{ matrix.arch }}
          path: /root/php-duckdb*.deb
          if-no-files-found: error

  ubuntu-devel-deb:
    needs: sdk-cache-tests
    name: Ubuntu devel deb (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    container: ubuntu:devel
    steps:
      - uses: actions/checkout@v4

      # Build the pinned patched SDK independently of distribution DuckDB.
      - name: Install build tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential debhelper dh-php php-dev php-cli \
            curl cmake python3 patch patchelf ca-certificates

      - name: Guard version drift
        run: |
          set -eu
          code_ver=$(sed -n '/PHP_DUCKDB_VERSION/{s/.* "//;s/".*$//;p}' php_duckdb.h)
          deb_ver=$(dpkg-parsechangelog -l packaging/debian/changelog -S Version)
          deb_ver=${deb_ver%%-*}
          if [ "$code_ver" != "$deb_ver" ]; then
            echo "version drift: php_duckdb.h=$code_ver debian/changelog=$deb_ver"
            exit 1
          fi

      - name: Stage debian packaging and engine source
        run: |
          set -eu
          cp -a "$GITHUB_WORKSPACE" /root/src
          cp -r /root/src/packaging/debian /root/src/debian
          chmod +x /root/src/debian/rules
          source_url=$(python3 -c 'import json; print(json.load(open("/root/src/packaging/duckdb/source.json"))["url"])')
          curl -fsSL --retry 4 --retry-all-errors --retry-max-time 300 \
            --connect-timeout 20 --max-time 180 -o /root/src/duckdb-source.tar.gz \
            "$source_url"

      - name: Restore verified DuckDB SDK artifacts
        id: sdk-cache
        uses: ./.github/actions/duckdb-sdk-cache
        with:
          target: debian

      - name: Build deb (with test suite)
        run: cd /root/src && dpkg-buildpackage -us -uc -b

      - name: Save completed DuckDB SDK artifacts
        if: ${{ !cancelled() && steps.sdk-cache.outputs.key != '' && steps.sdk-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.sdk-cache.outputs.path }}
          key: ${{ steps.sdk-cache.outputs.key }}

      - name: Install deb and smoke test with system PHP
        run: |
          set -eu
          dpkg -i /root/php-duckdb_*.deb
          module="$(php-config --extension-dir)/duckdb.so"
          readelf -d "$module" | grep -F 'libphp-duckdb-engine.so'
          ldd "$module" | grep -F '/php-duckdb/libphp-duckdb-engine.so'
          php -m | grep -i duckdb
          php /root/src/packaging/smoke.php

      - name: Upload deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-devel-deb-${{ matrix.arch }}
          path: /root/php-duckdb*.deb
          if-no-files-found: error

  # macOS has no distro package manager story for PHP extensions, so the
  # deliverable is a tarball per PHP minor version and architecture
  # (duckdb.so + vendored libduckdb.dylib + install script). Builds are
  # native: macos-15-intel (GitHub's last Intel image, available until
  # August 2027) for x86_64 and macos-15 for arm64, both targeting
  # macOS 12+. Both engine and extension are compiled for baseline CPUs;
  # no native CPU optimization is enabled in the source SDK builder.

  macos-tarball:
    needs: sdk-cache-tests
    name: macOS 12+ ${{ matrix.arch }} tarball — PHP ${{ matrix.php }}
    runs-on: ${{ matrix.arch == 'x86_64' && 'macos-15-intel' || 'macos-15' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        # 2.40.0-beta fixes Intel macOS PHP installation (upstream #1120).
        uses: shivammathur/setup-php@2.40.0-beta
        env:
          verbose: 'true'
        with:
          php-version: '${{ matrix.php }}'
          extensions: none
          coverage: none

      # build.sh stages the vendored SDK, phpize-builds duckdb.so,
      # rewrites its libduckdb reference to @rpath + @loader_path, runs
      # the full .phpt suite (Swoole/AMPHP/ReactPHP/True-Async tests
      # skip — those extensions are not installed here) and packs the
      # tarball. MACOSX_DEPLOYMENT_TARGET pins our own compile to
      # macOS 12+; the vendored dylib is built for the same target.
      - name: Install SDK build tools
        run: brew install cmake python

      - name: Restore verified DuckDB SDK artifacts
        id: sdk-cache
        uses: ./.github/actions/duckdb-sdk-cache
        env:
          MACOSX_DEPLOYMENT_TARGET: '12.0'
        with:
          target: macos

      - name: Build, test and package
        env:
          MACOSX_DEPLOYMENT_TARGET: '12.0'
        run: sh packaging/macos/build.sh

      - name: Save completed DuckDB SDK artifacts
        if: ${{ !cancelled() && steps.sdk-cache.outputs.key != '' && steps.sdk-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.sdk-cache.outputs.path }}
          key: ${{ steps.sdk-cache.outputs.key }}

      # Install the packaged tarball into the runner's PHP exactly like
      # a user would (sh install.sh, not the distro ini mechanism), then
      # run a query.
      - name: Install tarball and smoke test
        run: |
          set -euo pipefail
          mkdir -p /tmp/smoke
          tar -xzf dist/*.tar.gz -C /tmp/smoke
          (cd /tmp/smoke/php-duckdb-* && sh install.sh)
          php -r '$c = (new DuckDB\Database())->connect(); $r = $c->query("SELECT 42 AS x")->fetchRow(); if ($r["x"] !== 42) { exit(1); } printf("smoke OK: duckdb ext %s, libduckdb %s, PHP %s\n", phpversion("duckdb"), DuckDB\version(), PHP_VERSION);'

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos12-${{ matrix.arch }}-php${{ matrix.php }}
          path: dist/*.tar.gz
          if-no-files-found: error

  windows-zip:
    needs: sdk-cache-tests
    name: Windows x64 ZIP — PHP ${{ matrix.php }} ${{ matrix.ts }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        ts: [ts, nts]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      # Reviewed module APIs, SDK 2.8.2 and compiler mappings at this commit.
      # Import the module directly: the composite action has no pre-build
      # dependency hook and uploads its own ZIP to the artifact collector.
      - name: Fetch pinned official PHP Windows builder
        env:
          BUILDER_SHA: 5f63433eb2bda2ca8d0d970fe487be84f7ab195c
        run: |
          $ErrorActionPreference = 'Stop'
          $builder = Join-Path $env:RUNNER_TEMP 'php-windows-builder'
          git clone --no-checkout https://github.com/php/php-windows-builder.git $builder
          if ($LASTEXITCODE -ne 0) { throw 'Builder clone failed' }
          git -C $builder checkout --detach $env:BUILDER_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Builder checkout failed' }
          if ((git -C $builder rev-parse HEAD) -ne $env:BUILDER_SHA) { throw 'Builder revision mismatch' }

      - name: Restore verified DuckDB SDK artifacts
        id: sdk-cache
        uses: ./.github/actions/duckdb-sdk-cache
        with:
          target: windows

      - name: Build, test, package and smoke-test extracted ZIP
        run: |
          ./packaging/windows/build.ps1 -PhpVersion '${{ matrix.php }}' -ThreadSafety '${{ matrix.ts }}' `
            -BuilderPath "$env:RUNNER_TEMP/php-windows-builder" -BuildRoot "$env:RUNNER_TEMP/duckdb-windows"

      - name: Save completed DuckDB SDK artifacts
        if: ${{ !cancelled() && steps.sdk-cache.outputs.key != '' && steps.sdk-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.sdk-cache.outputs.path }}
          key: ${{ steps.sdk-cache.outputs.key }}

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-php${{ matrix.php }}-${{ matrix.ts }}-zip
          path: dist/php-duckdb-*-windows-x64.zip
          if-no-files-found: error

      - name: Upload Windows failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-diagnostics-php${{ matrix.php }}-${{ matrix.ts }}
          path: |
            ${{ runner.temp }}/duckdb-windows/duckdb-sdk-build/build/CMakeFiles/
            ${{ runner.temp }}/duckdb-windows/duckdb-sdk/share/duckdb-sdk/
            ${{ runner.temp }}/duckdb-windows/extension/build-*.txt
            ${{ runner.temp }}/duckdb-windows/extension/tests/**/*.diff
            ${{ runner.temp }}/duckdb-windows/extension/tests/**/*.out
            ${{ runner.temp }}/duckdb-windows/extension/tests/**/*.exp
            ${{ runner.temp }}/duckdb-windows/extension/tests/**/*.log
            ${{ runner.temp }}/duckdb-windows/extension/tests/**/*.php
            ${{ runner.temp }}/duckdb-windows/extension/tests/**/*.sh
          if-no-files-found: warn

  # Runs only when the workflow was triggered by publishing a GitHub
  # Release: waits for every packaging job, then attaches all built
  # packages to the release as assets.
  release-assets:
    name: Attach packages to release
    if: github.event_name == 'release'
    needs:
      - opensuse-rpm
      - fedora-rpm
      - amazonlinux-rpm
      - almalinux-rpm
      - macos-tarball
      - windows-zip
      - debian-deb
      - debian-trixie-deb
      - ubuntu-lts-deb
      - ubuntu-devel-deb
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Asset names get a distro suffix (php-duckdb_1.2.0-1_amd64.
      # ubuntu-26.04.deb): the deb filename is identical across distros,
      # so without the suffix same-named assets would clobber each other.
      # dpkg/rpm don't care about the file name, only the contents.
      # The architecture is already encoded in the package filename
      # itself (_amd64/_arm64 for debs, .x86_64/.aarch64 for rpms).
      # SRPMs vendor architecture-specific DuckDB archives, so retain
      # the build architecture in their asset names too.
      # macOS tarballs pass through unchanged: their names already carry
      # extension version, PHP minor, macOS floor and architecture.
      - name: Upload packages as release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for dir in artifacts/*/; do
            slug=$(basename "$dir")
            # Diagnostics are intentionally separate from downloadable packages.
            case "$slug" in windows-diagnostics-*) continue ;; esac
            arch=${slug##*-}
            slug=${slug%-amd64}
            slug=${slug%-arm64}
            slug=${slug%-deb}
            slug=${slug%-rpm}
            # RPM artifacts retain RPMS/<arch>/ and SRPMS/ directories.
            while IFS= read -r -d '' pkg; do
              base=$(basename "$pkg")
              case "$base" in
                *.deb) asset="${base%.deb}.${slug}.deb" ;;
                *.src.rpm) asset="${base%.rpm}.${slug}.${arch}.rpm" ;;
                *.rpm) asset="${base%.rpm}.${slug}.rpm" ;;
                *.tar.gz|php-duckdb-*-windows-x64.zip) asset="$base" ;;
                *) asset="${base}.${slug}" ;;
              esac
              cp "$pkg" "/tmp/${asset}"
              gh release upload "$GITHUB_REF_NAME" "/tmp/${asset}" \
                --repo "$GITHUB_REPOSITORY" --clobber
              rm "/tmp/${asset}"
            done < <(find "$dir" -type f -print0)
          done
