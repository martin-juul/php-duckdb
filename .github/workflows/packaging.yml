name: Packaging

# Keeps the distribution packaging in packaging/ buildable. Each job
# builds the native package in a real distro container (openSUSE
# Tumbleweed, Fedora 44, AlmaLinux 9/10 against the Remi repository's
# PHP, Debian sid, Debian 13 trixie, Ubuntu LTS, Ubuntu devel), runs the
# full test suite at build time, then installs the resulting package and
# smoke-tests the system PHP loading it through the distro's own ini
# mechanism. macOS has no such mechanism, so its job ships tarballs
# (duckdb.so + vendored libduckdb.dylib + install script) built natively
# on macos-15-intel and macos-15, targeting macOS 12+.
#
# Every Linux job runs on amd64 (ubuntu-latest) AND arm64
# (ubuntu-24.04-arm — native ARM64 runners, free for public repos), so
# each distro package is built and smoke-tested on both architectures
# DuckDB ships prebuilt libduckdb archives for.
#
# When a GitHub Release is published, all packages are rebuilt from the
# release tag and attached to the release as downloadable assets by the
# final release-assets job (which runs only for release events).

on:
  push:
    branches: [master]
    paths:
      - 'packaging/**'
      - 'config.m4'
      - 'duckdb.cpp'
      - 'php_duckdb.h'
      - 'duckdb_arginfo.h'
      - 'duckdb.stub.php'
      - 'src/**'
      - '.github/workflows/packaging.yml'
  pull_request:
    paths:
      - 'packaging/**'
      - 'config.m4'
      - 'duckdb.cpp'
      - 'php_duckdb.h'
      - 'duckdb_arginfo.h'
      - 'duckdb.stub.php'
      - 'src/**'
      - '.github/workflows/packaging.yml'
  release:
    types: [published]

jobs:
  opensuse-rpm:
    name: openSUSE Tumbleweed RPM (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    container: opensuse/tumbleweed:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tooling
        run: |
          zypper --non-interactive --gpg-auto-import-keys refresh
          zypper --non-interactive install --no-recommends \
            rpm-build php8 php8-devel gcc gcc-c++ make autoconf automake \
            chrpath unzip curl tar gzip gawk

      # rpmbuild never downloads Source URLs itself; stage them exactly as
      # the spec names them. The version is read from the spec so the two
      # cannot drift apart. The spec's Source1 is arch-conditional
      # (%ifarch x86_64 -> amd64 zip, aarch64 -> arm64 zip), so the
      # staged file name must match the build architecture.
      # NOTE: actions/checkout falls back to a REST tarball download when
      # the container has no git — leaving no .git directory — so pack the
      # workspace with tar instead of `git archive`.
      - name: Stage rpmbuild sources
        run: |
          set -eu
          ver=$(awk '/^Version:/ {print $2}' packaging/opensuse/php-duckdb.spec)
          dver=$(awk '/^%define duckdb_version/ {print $3}' packaging/opensuse/php-duckdb.spec)
          case "$(uname -m)" in
            x86_64) duck_arch=amd64 ;;
            aarch64) duck_arch=arm64 ;;
            *) echo "unsupported build arch: $(uname -m)" >&2; exit 1 ;;
          esac
          mkdir -p /root/rpmbuild/SOURCES /root/rpmbuild/SPECS /root/rpmbuild/BUILD /root/rpmbuild/RPMS /root/rpmbuild/SRPMS
          tar --exclude='./.git' --transform "s,^\.,php-duckdb-${ver}," \
            -czf "/root/rpmbuild/SOURCES/php-duckdb-${ver}.tar.gz" .
          curl -fsSL -o "/root/rpmbuild/SOURCES/libduckdb-linux-${duck_arch}.zip" \
            "https://github.com/duckdb/duckdb/releases/download/v${dver}/libduckdb-linux-${duck_arch}.zip"
          cp packaging/opensuse/php-duckdb.spec /root/rpmbuild/SPECS/

      # -ba builds the binary RPMs AND the SRPM; the spec's %check runs
      # the full .phpt suite (Swoole/AMPHP/ReactPHP/True-Async tests skip
      # — those extensions are not installed here).
      - name: Build RPM (with test suite)
        run: rpmbuild --define '_topdir /root/rpmbuild' -ba /root/rpmbuild/SPECS/php-duckdb.spec

      - name: Install RPM and smoke test with system PHP
        run: |
          set -eu
          rpm -ivh /root/rpmbuild/RPMS/$(uname -m)/php8-duckdb-*.rpm
          php -m | grep -i duckdb
          php -r '$c = (new DuckDB\Database())->connect(); $r = $c->query("SELECT 42 AS x")->fetchRow(); if ($r["x"] !== 42) { exit(1); } printf("smoke OK: duckdb ext %s, libduckdb %s, PHP %s\n", phpversion("duckdb"), DuckDB\version(), PHP_VERSION);'

      - name: Upload RPM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opensuse-tumbleweed-rpm-${{ matrix.arch }}
          path: |
            /root/rpmbuild/RPMS/*/*.rpm
            /root/rpmbuild/SRPMS/*.rpm
          if-no-files-found: error

  fedora-rpm:
    name: Fedora 44 RPM (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    container: fedora:44
    steps:
      - uses: actions/checkout@v4

      - name: Install build tooling
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            rpm-build php-devel php-cli gcc gcc-c++ make libtool chrpath \
            unzip curl tar gzip gawk

      # Same staging story as the openSUSE job: checkout may fall back to
      # a REST tarball (no git in the container, no .git), so pack the
      # workspace with tar; rpmbuild never downloads Source URLs itself.
      # The spec's Source1 is arch-conditional (%ifarch), so stage the
      # libduckdb zip under the name matching the build architecture.
      - name: Stage rpmbuild sources
        run: |
          set -eu
          ver=$(awk '/^%global upstream_version/ {print $3}' packaging/fedora/php-pecl-duckdb.spec)
          dver=$(awk '/^%global duckdb_version/ {print $3}' packaging/fedora/php-pecl-duckdb.spec)
          case "$(uname -m)" in
            x86_64) duck_arch=amd64 ;;
            aarch64) duck_arch=arm64 ;;
            *) echo "unsupported build arch: $(uname -m)" >&2; exit 1 ;;
          esac
          mkdir -p /root/rpmbuild/SOURCES /root/rpmbuild/SPECS /root/rpmbuild/BUILD /root/rpmbuild/RPMS /root/rpmbuild/SRPMS
          tar --exclude='./.git' --transform "s,^\.,php-duckdb-${ver}," \
            -czf "/root/rpmbuild/SOURCES/php-duckdb-${ver}.tar.gz" .
          curl -fsSL -o "/root/rpmbuild/SOURCES/libduckdb-linux-${duck_arch}.zip" \
            "https://github.com/duckdb/duckdb/releases/download/v${dver}/libduckdb-linux-${duck_arch}.zip"
          cp packaging/fedora/php-pecl-duckdb.spec /root/rpmbuild/SPECS/

      # -ba builds the binary RPMs AND the SRPM; the spec's %check runs
      # the full .phpt suite (Swoole/AMPHP/ReactPHP/True-Async tests skip
      # — those extensions are not installed here).
      - name: Build RPM (with test suite)
        run: rpmbuild --define '_topdir /root/rpmbuild' -ba /root/rpmbuild/SPECS/php-pecl-duckdb.spec

      - name: Install RPM and smoke test with system PHP
        run: |
          set -eu
          rpm -ivh /root/rpmbuild/RPMS/$(uname -m)/php-pecl-duckdb-*.rpm
          php -m | grep -i duckdb
          php -r '$c = (new DuckDB\Database())->connect(); $r = $c->query("SELECT 42 AS x")->fetchRow(); if ($r["x"] !== 42) { exit(1); } printf("smoke OK: duckdb ext %s, libduckdb %s, PHP %s\n", phpversion("duckdb"), DuckDB\version(), PHP_VERSION);'

      - name: Upload RPM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fedora-44-rpm-${{ matrix.arch }}
          path: |
            /root/rpmbuild/RPMS/*/*.rpm
            /root/rpmbuild/SRPMS/*.rpm
          if-no-files-found: error

  almalinux-rpm:
    name: AlmaLinux ${{ matrix.os }} RPM — Remi PHP ${{ matrix.php }} (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: ['9', '10']
        php: ['8.2', '8.3', '8.4', '8.5']
        arch: [amd64, arm64]
    container: almalinux:${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Remi's default-namespace PHP via the remi-8.x php module streams
      # from the remi-modular repo (enabled by default in remi-release).
      # This is Remi's documented EL flow; the legacy dedicated
      # remi-php82/83/84/85 repos no longer ship in remi-release.
      # Resetting the php module first drops any AppStream default
      # stream (EL9's php:8.2), so the remi stream wins; the reset is
      # tolerated to fail where no distribution php module exists.
      # After the stream switch, plain php-devel/php-cli resolve from it.
      - name: Install Remi repository and build tooling
        run: |
          set -eu
          dnf install -y --setopt=install_weak_deps=False epel-release
          dnf install -y "https://rpms.remirepo.net/enterprise/remi-release-${{ matrix.os }}.rpm"
          dnf module reset -y php 2>/dev/null || true
          dnf module install -y "php:remi-${{ matrix.php }}/common"
          dnf install -y --setopt=install_weak_deps=False \
            php-devel php-cli \
            rpm-build gcc gcc-c++ make libtool chrpath unzip curl tar gzip gawk
          php -v | head -1

      # Same staging story as the Fedora job: checkout may fall back to a
      # REST tarball (no git in the container, no .git), so pack the
      # workspace with tar; rpmbuild never downloads Source URLs itself.
      # The spec's Source1 is arch-conditional (%ifarch), so stage the
      # libduckdb zip under the name matching the build architecture.
      - name: Stage rpmbuild sources
        run: |
          set -eu
          ver=$(awk '/^%global upstream_version/ {print $3}' packaging/almalinux/php-pecl-duckdb.spec)
          dver=$(awk '/^%global duckdb_version/ {print $3}' packaging/almalinux/php-pecl-duckdb.spec)
          case "$(uname -m)" in
            x86_64) duck_arch=amd64 ;;
            aarch64) duck_arch=arm64 ;;
            *) echo "unsupported build arch: $(uname -m)" >&2; exit 1 ;;
          esac
          mkdir -p /root/rpmbuild/SOURCES /root/rpmbuild/SPECS /root/rpmbuild/BUILD /root/rpmbuild/RPMS /root/rpmbuild/SRPMS
          tar --exclude='./.git' --transform "s,^\.,php-duckdb-${ver}," \
            -czf "/root/rpmbuild/SOURCES/php-duckdb-${ver}.tar.gz" .
          curl -fsSL -o "/root/rpmbuild/SOURCES/libduckdb-linux-${duck_arch}.zip" \
            "https://github.com/duckdb/duckdb/releases/download/v${dver}/libduckdb-linux-${duck_arch}.zip"
          cp packaging/almalinux/php-pecl-duckdb.spec /root/rpmbuild/SPECS/

      # -bb builds the binary RPM only: this 16-cell matrix would
      # otherwise publish 8 identical SRPMs per distro version.
      # The spec's %check runs the full .phpt suite (Swoole/AMPHP/
      # ReactPHP/True-Async tests skip — those extensions are not
      # installed here).
      - name: Build RPM (with test suite)
        run: rpmbuild --define '_topdir /root/rpmbuild' -bb /root/rpmbuild/SPECS/php-pecl-duckdb.spec

      - name: Install RPM and smoke test with Remi PHP
        run: |
          set -eu
          rpm -ivh /root/rpmbuild/RPMS/$(uname -m)/php-pecl-duckdb-*.rpm
          php -m | grep -i duckdb
          php -r '$c = (new DuckDB\Database())->connect(); $r = $c->query("SELECT 42 AS x")->fetchRow(); if ($r["x"] !== 42) { exit(1); } printf("smoke OK: duckdb ext %s, libduckdb %s, PHP %s\n", phpversion("duckdb"), DuckDB\version(), PHP_VERSION);'

      - name: Upload RPM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: almalinux-${{ matrix.os }}-php${{ matrix.php }}-rpm-${{ matrix.arch }}
          path: /root/rpmbuild/RPMS/*/*.rpm
          if-no-files-found: error

  debian-deb:
    name: Debian sid deb (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    container: debian:sid
    steps:
      - uses: actions/checkout@v4

      # Debian is the one target using the system libduckdb strategy:
      # sid ships libduckdb-dev (amd64 + arm64), so no vendored archive
      # is downloaded.
      - name: Install build tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential debhelper dh-php php-dev php-cli libduckdb-dev

      # Same guard as the Fedora spec's %prep check: the changelog
      # version and PHP_DUCKDB_VERSION must not drift apart.
      - name: Guard version drift
        run: |
          set -eu
          code_ver=$(sed -n '/PHP_DUCKDB_VERSION/{s/.* "//;s/".*$//;p}' php_duckdb.h)
          deb_ver=$(dpkg-parsechangelog -l packaging/debian/changelog -S Version)
          deb_ver=${deb_ver%%-*}
          if [ "$code_ver" != "$deb_ver" ]; then
            echo "version drift: php_duckdb.h=$code_ver debian/changelog=$deb_ver"
            exit 1
          fi

      # dpkg insists on ./debian at the source root; copy it out of
      # packaging/ and restore the execute bit on debian/rules.
      - name: Stage debian packaging
        run: |
          set -eu
          cp -a "$GITHUB_WORKSPACE" /root/src
          cp -r /root/src/packaging/debian /root/src/debian
          chmod +x /root/src/debian/rules

      # dpkg-buildpackage -b builds the binary debs (landing next to the
      # source tree); dh_auto_test runs the full .phpt suite with
      # NO_INTERACTION=1 / REPORT_EXIT_STATUS=1 from debian/rules
      # (Swoole/AMPHP/ReactPHP/True-Async tests skip — those extensions
      # are not installed here).
      - name: Build deb (with test suite)
        run: cd /root/src && dpkg-buildpackage -us -uc -b

      - name: Install deb and smoke test with system PHP
        run: |
          set -eu
          dpkg -i /root/php-duckdb_*.deb
          php -m | grep -i duckdb
          php -r '$c = (new DuckDB\Database())->connect(); $r = $c->query("SELECT 42 AS x")->fetchRow(); if ($r["x"] !== 42) { exit(1); } printf("smoke OK: duckdb ext %s, libduckdb %s, PHP %s\n", phpversion("duckdb"), DuckDB\version(), PHP_VERSION);'

      - name: Upload deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debian-sid-deb-${{ matrix.arch }}
          path: /root/php-duckdb*.deb
          if-no-files-found: error

  debian-trixie-deb:
    name: Debian 13 trixie deb (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4

      # trixie has no libduckdb package (DuckDB entered Debian after the
      # freeze), so this job vendors the prebuilt archive — the same
      # strategy as the RPM jobs; the sid job uses libduckdb-dev instead.
      - name: Install build tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential debhelper dh-php php-dev php-cli \
            curl unzip ca-certificates

      - name: Guard version drift
        run: |
          set -eu
          code_ver=$(sed -n '/PHP_DUCKDB_VERSION/{s/.* "//;s/".*$//;p}' php_duckdb.h)
          deb_ver=$(dpkg-parsechangelog -l packaging/debian-trixie/changelog -S Version)
          deb_ver=${deb_ver%%-*}
          if [ "$code_ver" != "$deb_ver" ]; then
            echo "version drift: php_duckdb.h=$code_ver debian-trixie/changelog=$deb_ver"
            exit 1
          fi

      # dpkg insists on ./debian at the source root; restore the execute
      # bit on debian/rules. The vendored libduckdb is staged as
      # duckdb-sdk/{include,lib}; the pin lives in debian-trixie/rules
      # so the two cannot drift apart. The zip is selected per build
      # architecture (DuckDB publishes amd64 + arm64 archives).
      - name: Stage debian packaging and vendored libduckdb
        run: |
          set -eu
          cp -a "$GITHUB_WORKSPACE" /root/src
          cp -r /root/src/packaging/debian-trixie /root/src/debian
          chmod +x /root/src/debian/rules
          dver=$(awk -F':= *' '/^DUCKDB_VERSION/ {print $2}' /root/src/debian/rules)
          arch=$(dpkg --print-architecture)
          case "$arch" in
            amd64) duck_arch=amd64 ;;
            arm64) duck_arch=arm64 ;;
            *) echo "no prebuilt libduckdb archive for $arch"; exit 1 ;;
          esac
          curl -fsSL -o /tmp/libduckdb.zip \
            "https://github.com/duckdb/duckdb/releases/download/v${dver}/libduckdb-linux-${duck_arch}.zip"
          unzip -o /tmp/libduckdb.zip -d /tmp/libduckdb
          mkdir -p /root/src/duckdb-sdk/include /root/src/duckdb-sdk/lib
          cp /tmp/libduckdb/duckdb.h /root/src/duckdb-sdk/include/
          cp /tmp/libduckdb/libduckdb.so /root/src/duckdb-sdk/lib/

      # dpkg-buildpackage -b builds the binary debs (landing next to the
      # source tree); dh_auto_test runs the full .phpt suite with
      # NO_INTERACTION=1 / REPORT_EXIT_STATUS=1 from debian/rules, with
      # LD_LIBRARY_PATH pointed at the staged duckdb-sdk/lib
      # (Swoole/AMPHP/ReactPHP/True-Async tests skip — those extensions
      # are not installed here).
      - name: Build deb (with test suite)
        run: cd /root/src && dpkg-buildpackage -us -uc -b

      - name: Install deb and smoke test with system PHP
        run: |
          set -eu
          dpkg -i /root/php-duckdb_*.deb
          php -m | grep -i duckdb
          php -r '$c = (new DuckDB\Database())->connect(); $r = $c->query("SELECT 42 AS x")->fetchRow(); if ($r["x"] !== 42) { exit(1); } printf("smoke OK: duckdb ext %s, libduckdb %s, PHP %s\n", phpversion("duckdb"), DuckDB\version(), PHP_VERSION);'

      - name: Upload deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debian-13-trixie-deb-${{ matrix.arch }}
          path: /root/php-duckdb*.deb
          if-no-files-found: error

  ubuntu-lts-deb:
    name: Ubuntu ${{ matrix.release }} LTS deb (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        # noble: PHP 8.3, resolute: PHP 8.5 — neither has a libduckdb
        # package, so both use the vendored strategy (packaging/ubuntu).
        release: ['24.04', '26.04']
        arch: [amd64, arm64]
    container: ubuntu:${{ matrix.release }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential debhelper dh-php php-dev php-cli \
            curl unzip ca-certificates

      - name: Guard version drift
        run: |
          set -eu
          code_ver=$(sed -n '/PHP_DUCKDB_VERSION/{s/.* "//;s/".*$//;p}' php_duckdb.h)
          deb_ver=$(dpkg-parsechangelog -l packaging/ubuntu/changelog -S Version)
          deb_ver=${deb_ver%%-*}
          if [ "$code_ver" != "$deb_ver" ]; then
            echo "version drift: php_duckdb.h=$code_ver ubuntu/changelog=$deb_ver"
            exit 1
          fi

      # dpkg insists on ./debian at the source root; restore the execute
      # bit on debian/rules. The vendored libduckdb is staged as
      # duckdb-sdk/{include,lib}; the pin lives in ubuntu/rules so the
      # two cannot drift apart. The zip is selected per build
      # architecture (DuckDB publishes amd64 + arm64 archives).
      - name: Stage debian packaging and vendored libduckdb
        run: |
          set -eu
          cp -a "$GITHUB_WORKSPACE" /root/src
          cp -r /root/src/packaging/ubuntu /root/src/debian
          chmod +x /root/src/debian/rules
          dver=$(awk -F':= *' '/^DUCKDB_VERSION/ {print $2}' /root/src/debian/rules)
          arch=$(dpkg --print-architecture)
          case "$arch" in
            amd64) duck_arch=amd64 ;;
            arm64) duck_arch=arm64 ;;
            *) echo "no prebuilt libduckdb archive for $arch"; exit 1 ;;
          esac
          curl -fsSL -o /tmp/libduckdb.zip \
            "https://github.com/duckdb/duckdb/releases/download/v${dver}/libduckdb-linux-${duck_arch}.zip"
          unzip -o /tmp/libduckdb.zip -d /tmp/libduckdb
          mkdir -p /root/src/duckdb-sdk/include /root/src/duckdb-sdk/lib
          cp /tmp/libduckdb/duckdb.h /root/src/duckdb-sdk/include/
          cp /tmp/libduckdb/libduckdb.so /root/src/duckdb-sdk/lib/

      # dpkg-buildpackage -b builds the binary debs (landing next to the
      # source tree); dh_auto_test runs the full .phpt suite with
      # NO_INTERACTION=1 / REPORT_EXIT_STATUS=1 from debian/rules, with
      # LD_LIBRARY_PATH pointed at the staged duckdb-sdk/lib
      # (Swoole/AMPHP/ReactPHP/True-Async tests skip — those extensions
      # are not installed here).
      - name: Build deb (with test suite)
        run: cd /root/src && dpkg-buildpackage -us -uc -b

      - name: Install deb and smoke test with system PHP
        run: |
          set -eu
          dpkg -i /root/php-duckdb_*.deb
          php -m | grep -i duckdb
          php -r '$c = (new DuckDB\Database())->connect(); $r = $c->query("SELECT 42 AS x")->fetchRow(); if ($r["x"] !== 42) { exit(1); } printf("smoke OK: duckdb ext %s, libduckdb %s, PHP %s\n", phpversion("duckdb"), DuckDB\version(), PHP_VERSION);'

      - name: Upload deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-${{ matrix.release }}-deb-${{ matrix.arch }}
          path: /root/php-duckdb*.deb
          if-no-files-found: error

  ubuntu-devel-deb:
    name: Ubuntu devel deb (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    container: ubuntu:devel
    steps:
      - uses: actions/checkout@v4

      # Ubuntu devel (26.10+) ships libduckdb-dev in universe — the
      # system strategy, reusing the Debian sid packaging unchanged.
      - name: Install build tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential debhelper dh-php php-dev php-cli libduckdb-dev

      - name: Guard version drift
        run: |
          set -eu
          code_ver=$(sed -n '/PHP_DUCKDB_VERSION/{s/.* "//;s/".*$//;p}' php_duckdb.h)
          deb_ver=$(dpkg-parsechangelog -l packaging/debian/changelog -S Version)
          deb_ver=${deb_ver%%-*}
          if [ "$code_ver" != "$deb_ver" ]; then
            echo "version drift: php_duckdb.h=$code_ver debian/changelog=$deb_ver"
            exit 1
          fi

      - name: Stage debian packaging
        run: |
          set -eu
          cp -a "$GITHUB_WORKSPACE" /root/src
          cp -r /root/src/packaging/debian /root/src/debian
          chmod +x /root/src/debian/rules

      - name: Build deb (with test suite)
        run: cd /root/src && dpkg-buildpackage -us -uc -b

      - name: Install deb and smoke test with system PHP
        run: |
          set -eu
          dpkg -i /root/php-duckdb_*.deb
          php -m | grep -i duckdb
          php -r '$c = (new DuckDB\Database())->connect(); $r = $c->query("SELECT 42 AS x")->fetchRow(); if ($r["x"] !== 42) { exit(1); } printf("smoke OK: duckdb ext %s, libduckdb %s, PHP %s\n", phpversion("duckdb"), DuckDB\version(), PHP_VERSION);'

      - name: Upload deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-devel-deb-${{ matrix.arch }}
          path: /root/php-duckdb*.deb
          if-no-files-found: error

  # macOS has no distro package manager story for PHP extensions, so the
  # deliverable is a tarball per PHP minor version and architecture
  # (duckdb.so + vendored libduckdb.dylib + install script). Builds are
  # native: macos-15-intel (GitHub's last Intel image, available until
  # August 2027) for x86_64 and macos-15 for arm64, both targeting
  # macOS 12+. The vendored universal libduckdb is baseline x86-64
  # (verified: zero AVX/AVX2 instructions in its x86_64 slice) with a
  # macOS 11.0 deployment target, so the single x86_64 build also covers
  # pre-AVX2 Intel Macs (Mac Pro 2013) and x86_64 PHP under Rosetta,
  # which only supports AVX2 from macOS 15.
  macos-tarball:
    name: macOS 12+ ${{ matrix.arch }} tarball — PHP ${{ matrix.php }}
    runs-on: ${{ matrix.arch == 'x86_64' && 'macos-15-intel' || 'macos-15' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php }}'
          extensions: none
          coverage: none

      # build.sh stages the vendored SDK, phpize-builds duckdb.so,
      # rewrites its libduckdb reference to @rpath + @loader_path, runs
      # the full .phpt suite (Swoole/AMPHP/ReactPHP/True-Async tests
      # skip — those extensions are not installed here) and packs the
      # tarball. MACOSX_DEPLOYMENT_TARGET pins our own compile to
      # macOS 12+; the vendored dylib already targets 11.0.
      - name: Build, test and package
        env:
          MACOSX_DEPLOYMENT_TARGET: '12.0'
        run: sh packaging/macos/build.sh

      # Install the packaged tarball into the runner's PHP exactly like
      # a user would (sh install.sh, not the distro ini mechanism), then
      # run a query.
      - name: Install tarball and smoke test
        run: |
          set -euo pipefail
          mkdir -p /tmp/smoke
          tar -xzf dist/*.tar.gz -C /tmp/smoke
          (cd /tmp/smoke/php-duckdb-* && sh install.sh)
          php -r '$c = (new DuckDB\Database())->connect(); $r = $c->query("SELECT 42 AS x")->fetchRow(); if ($r["x"] !== 42) { exit(1); } printf("smoke OK: duckdb ext %s, libduckdb %s, PHP %s\n", phpversion("duckdb"), DuckDB\version(), PHP_VERSION);'

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos12-${{ matrix.arch }}-php${{ matrix.php }}
          path: dist/*.tar.gz
          if-no-files-found: error

  # Runs only when the workflow was triggered by publishing a GitHub
  # Release: waits for every packaging job, then attaches all built
  # packages to the release as assets.
  release-assets:
    name: Attach packages to release
    if: github.event_name == 'release'
    needs:
      - opensuse-rpm
      - fedora-rpm
      - almalinux-rpm
      - macos-tarball
      - debian-deb
      - debian-trixie-deb
      - ubuntu-lts-deb
      - ubuntu-devel-deb
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Asset names get a distro suffix (php-duckdb_1.2.0-1_amd64.
      # ubuntu-26.04.deb): the deb filename is identical across distros,
      # so without the suffix same-named assets would clobber each other.
      # dpkg/rpm don't care about the file name, only the contents.
      # The architecture is already encoded in the package filename
      # itself (_amd64/_arm64 for debs, .x86_64/.aarch64 for rpms).
      # Arch-independent SRPMs are produced by both arch builds; the
      # second upload simply clobbers the first (identical content).
      # macOS tarballs pass through unchanged: their names already carry
      # extension version, PHP minor, macOS floor and architecture.
      - name: Upload packages as release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for dir in artifacts/*/; do
            slug=$(basename "$dir")
            slug=${slug%-amd64}
            slug=${slug%-arm64}
            slug=${slug%-deb}
            slug=${slug%-rpm}
            for pkg in "$dir"*; do
              base=$(basename "$pkg")
              case "$base" in
                *.deb) asset="${base%.deb}.${slug}.deb" ;;
                *.rpm) asset="${base%.rpm}.${slug}.rpm" ;;
                *.tar.gz) asset="$base" ;;
                *) asset="${base}.${slug}" ;;
              esac
              cp "$pkg" "/tmp/${asset}"
              gh release upload "$GITHUB_REF_NAME" "/tmp/${asset}" --clobber
              rm "/tmp/${asset}"
            done
          done
