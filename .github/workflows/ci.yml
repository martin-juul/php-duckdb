name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  pie-install:
    name: PIE installation (PHP 8.4)
    runs-on: ubuntu-26.04
    env:
      LD_LIBRARY_PATH: /opt/duckdb/lib
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP and PIE
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer, pie

      - name: Validate package metadata
        run: composer validate --strict

      - name: Install patched DuckDB SDK
        uses: ./.github/actions/duckdb-sdk

      - name: Install checkout through PIE
        run: |
          # PIE cannot elevate from a non-interactive terminal. Run both
          # commands as root so they share the same PIE repository config.
          PHP_BIN="$(command -v php)"
          PIE_BIN="$(command -v pie)"
          sudo -nH env LD_LIBRARY_PATH="$LD_LIBRARY_PATH" "$PHP_BIN" "$PIE_BIN" repository:add path "$GITHUB_WORKSPACE"
          sudo -nH env LD_LIBRARY_PATH="$LD_LIBRARY_PATH" "$PHP_BIN" "$PIE_BIN" install 'martinjuul/duckdb:*@dev' --with-duckdb=/opt/duckdb --no-interaction

      - name: Verify installed extension
        run: |
          php <<'PHP'
          <?php
          if (!extension_loaded('duckdb')) {
              throw new RuntimeException('PIE did not enable duckdb');
          }
          $connection = (new DuckDB\Database())->connect();
          $row = $connection->query('SELECT 42 AS answer')->fetchRow();
          if ($row !== ['answer' => 42]) {
              throw new RuntimeException('Unexpected query result: ' . var_export($row, true));
          }
          echo "PIE installation smoke test passed\n";
          PHP

  build-and-test:
    name: PHP ${{ matrix.php }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        php: ['8.2', '8.3', '8.4', '8.5']

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ffi

      - name: Install patched DuckDB SDK
        uses: ./.github/actions/duckdb-sdk


      - name: Resource allocation and harness regression checks
        run: |
          python3 -m unittest discover -s packaging/resources/tests
          php tests/harness/resources.php
          php tests/harness/diagnostics.php

      - name: Harness (build + unit + examples)
        env:
          TMPDIR: ${{ runner.temp }}
          LD_LIBRARY_PATH: /opt/duckdb/lib
          DYLD_LIBRARY_PATH: /opt/duckdb/lib
        run: php tests/harness.php --no-color --junit=junit.xml

      - name: Capture core backtrace on Linux failure
        if: failure() && runner.os == 'Linux'
        continue-on-error: true
        env:
          LD_LIBRARY_PATH: /opt/duckdb/lib
        run: |
          sudo apt-get install -y gdb
          ulimit -c unlimited
          sudo sysctl -w kernel.core_pattern=/tmp/core.%p
          FAILING_PHPT=$(ls -t tests/*.diff 2>/dev/null | head -1 | sed 's/\.diff$/.phpt/')
          if [ -n "$FAILING_PHPT" ]; then
            PHP_BIN=$(which php)
            gdb -batch -ex run -ex "bt 30" \
              --args "$PHP_BIN" -d extension="$GITHUB_WORKSPACE/modules/duckdb.so" \
              run-tests.php -q "$FAILING_PHPT" 2>&1 | tail -60 || true
          fi

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-failures-${{ matrix.os }}-php${{ matrix.php }}
          path: |
            ${{ runner.temp }}/duckdb-*-run-tests-*
            tests/*.diff
            tests/*.out
            tests/*.exp
            tests/*.log
            junit.xml
          if-no-files-found: ignore

  extended:
    name: Swoole + Valgrind + stress (PHP 8.4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          # Swoole is installed by setup-php, not by a bare pecl call:
          # pecl run as the runner user no longer has write access to
          # php_dir on current ubuntu-latest images ("Cannot install,
          # php_dir for channel pecl.php.net is not writeable").
          extensions: ffi, swoole
          # Xdebug must stay off in this job: its fcall observers crash at
          # request shutdown (zend_observer_fcall_end_all ->
          # xdebug_execute_user_code_end, SIGSEGV) once a Swoole coroutine
          # has suspended/resumed via boost-asm context switching. This is
          # a known upstream Xdebug x Swoole incompatibility
          # (swoole-src#4487, xdebug bug #2221), unrelated to this
          # extension — a 7-line Swoole-only script reproduces it. No
          # coverage is collected in this job anyway.
          coverage: none

      - name: Install patched DuckDB SDK
        uses: ./.github/actions/duckdb-sdk

      - name: Install Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind

      - name: Verify engine checkpoint regression
        env:
          LD_LIBRARY_PATH: /opt/duckdb/lib
        run: |
          cc -std=c11 -Wall -Wextra -Werror -I/opt/duckdb/include \
            tests/native/nullable_bitpacking_matrix.c -L/opt/duckdb/lib -lduckdb \
            -o /tmp/nullable-bitpacking
          test_dir=$(mktemp -d)
          valgrind --fair-sched=try --error-exitcode=99 --leak-check=full \
            --errors-for-leak-kinds=definite \
            /tmp/nullable-bitpacking "$test_dir/checkpoint.duckdb"

      - name: Harness (build + unit + Swoole examples)
        env:
          TMPDIR: ${{ runner.temp }}
          LD_LIBRARY_PATH: /opt/duckdb/lib
        run: php tests/harness.php --no-color --junit=junit.xml

      - name: Valgrind
        env:
          TMPDIR: ${{ runner.temp }}
          LD_LIBRARY_PATH: /opt/duckdb/lib
          USE_ZEND_ALLOC: '0'
        run: php tests/harness.php --valgrind --no-color --junit=valgrind-junit.xml

      - name: Stress
        env:
          LD_LIBRARY_PATH: /opt/duckdb/lib
        run: php tests/harness.php --stress --no-color
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: extended-failures
          path: |
            ${{ runner.temp }}/duckdb-*-run-tests-*
            tests/*.diff
            tests/*.out
            tests/*.exp
            tests/*.log
            tests/*.mem
            junit.xml
            valgrind-junit.xml
          if-no-files-found: ignore

  amphp:
    name: Amp async (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ffi
          tools: composer

      - name: Install patched DuckDB SDK
        uses: ./.github/actions/duckdb-sdk

      - name: Install Amp
        run: |
          mkdir -p /tmp/amphp
          cd /tmp/amphp
          composer require amphp/amp:^3.0 --no-interaction --quiet

      - name: Harness (unit + Amp examples)
        env:
          TMPDIR: ${{ runner.temp }}
          LD_LIBRARY_PATH: /opt/duckdb/lib
          DUCKDB_AMPHP_AUTOLOAD: /tmp/amphp/vendor/autoload.php
        run: php tests/harness.php --no-color --junit=junit.xml

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: amphp-failures-php${{ matrix.php }}
          path: |
            ${{ runner.temp }}/duckdb-*-run-tests-*
            tests/*.diff
            tests/*.out
            tests/*.exp
            tests/*.log
            junit.xml
          if-no-files-found: ignore

  reactphp:
    name: ReactPHP async (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ffi
          tools: composer

      - name: Install patched DuckDB SDK
        uses: ./.github/actions/duckdb-sdk

      - name: Install ReactPHP
        run: |
          mkdir -p /tmp/reactphp
          cd /tmp/reactphp
          composer require react/async:^4.0 --no-interaction --quiet

      - name: Harness (unit + ReactPHP examples)
        env:
          TMPDIR: ${{ runner.temp }}
          LD_LIBRARY_PATH: /opt/duckdb/lib
          DUCKDB_REACTPHP_AUTOLOAD: /tmp/reactphp/vendor/autoload.php
        run: php tests/harness.php --no-color --junit=junit.xml

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reactphp-failures-php${{ matrix.php }}
          path: |
            ${{ runner.temp }}/duckdb-*-run-tests-*
            tests/*.diff
            tests/*.out
            tests/*.exp
            tests/*.log
            junit.xml
          if-no-files-found: ignore

  true-async:
    name: True-async (PHP 8.6)
    runs-on: ubuntu-latest
    container: trueasync/php-true-async:0.7.13-php8.6
    steps:
      - uses: actions/checkout@v4

      - name: Install PHP build tools
        run: apt-get update && apt-get install -y autoconf pkg-config git gdb

      - name: Install patched DuckDB SDK
        uses: ./.github/actions/duckdb-sdk

      - name: Harness (build + unit + true-async examples)
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
          LD_LIBRARY_PATH: /opt/duckdb/lib
        run: php tests/harness.php --no-color --junit=junit.xml

      - name: Capture core backtrace on failure
        if: failure()
        continue-on-error: true
        shell: bash
        env:
          LD_LIBRARY_PATH: /opt/duckdb/lib
        run: |
          ulimit -c unlimited
          sysctl -w kernel.core_pattern=/tmp/core.%p || true
          FAILING_PHPT=$(ls -t tests/*.diff 2>/dev/null | head -1 | sed 's/\.diff$/.phpt/')
          if [ -n "$FAILING_PHPT" ]; then
            PHP_BIN=$(which php)
            gdb -batch -ex run -ex "bt 30" \
              --args "$PHP_BIN" -d extension="$GITHUB_WORKSPACE/modules/duckdb.so" \
              run-tests.php -q "$FAILING_PHPT" 2>&1 | tail -60 || true
          fi

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: true-async-failures
          path: |
            ${{ runner.temp }}/duckdb-*-run-tests-*
            tests/*.diff
            tests/*.out
            tests/*.exp
            tests/*.log
            junit.xml
          if-no-files-found: ignore

  frankenphp:
    name: FrankenPHP worker mode (ZTS, PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    # The builder images ship the exact ZTS PHP that FrankenPHP embeds,
    # plus phpize/php-config and the frankenphp binary.
    container: dunglas/frankenphp:builder-php${{ matrix.php }}
    steps:
      - uses: actions/checkout@v4

      - name: Install patched DuckDB SDK
        uses: ./.github/actions/duckdb-sdk

      - name: Harness (ZTS build + unit + examples)
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
          LD_LIBRARY_PATH: /opt/duckdb/lib
        run: php tests/harness.php --no-color --junit=junit.xml

      # Serve examples/frankenphp.php in worker mode, hammer it, then
      # SIGTERM: a clean exit proves no in-flight async worker outlives
      # module unload (test 065's race, end to end).
      - name: Worker-mode smoke test
        shell: bash
        env:
          LD_LIBRARY_PATH: /opt/duckdb/lib
        run: |
          set -eux
          cd examples
          mkdir -p /tmp/fpini
          printf 'extension=%s/modules/duckdb.so\n' "$GITHUB_WORKSPACE" > /tmp/fpini/php.ini
          PHPRC=/tmp/fpini frankenphp run --config frankenphp.Caddyfile &
          FP_PID=$!
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:8080/ && break || sleep 1
          done
          seq 1 200 | xargs -P 16 -I{} curl -sf http://localhost:8080/ -o /dev/null
          kill -TERM $FP_PID
          wait $FP_PID

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frankenphp-failures-php${{ matrix.php }}
          path: |
            ${{ runner.temp }}/duckdb-*-run-tests-*
            tests/*.diff
            tests/*.out
            tests/*.exp
            tests/*.log
            junit.xml
          if-no-files-found: ignore
