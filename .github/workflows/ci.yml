name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-test:
    name: PHP ${{ matrix.php }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        php: ['8.2', '8.3', '8.4', '8.5']

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ffi

      - name: Install libduckdb (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -sL "https://github.com/duckdb/duckdb/releases/download/v1.5.5/libduckdb-linux-amd64.zip" -o /tmp/libduckdb.zip
          sudo mkdir -p /opt/duckdb/include /opt/duckdb/lib
          sudo unzip -o /tmp/libduckdb.zip -d /opt/duckdb
          sudo mv /opt/duckdb/duckdb.h /opt/duckdb/include/
          sudo mv /opt/duckdb/libduckdb.* /opt/duckdb/lib/

      - name: Install libduckdb (macOS)
        if: runner.os == 'macOS'
        run: |
          curl -sL "https://github.com/duckdb/duckdb/releases/download/v1.5.5/libduckdb-osx-universal.zip" -o /tmp/libduckdb.zip
          sudo mkdir -p /opt/duckdb/include /opt/duckdb/lib
          sudo unzip -o /tmp/libduckdb.zip -d /opt/duckdb
          sudo mv /opt/duckdb/duckdb.h /opt/duckdb/include/
          sudo mv /opt/duckdb/libduckdb.* /opt/duckdb/lib/

      - name: Harness (build + unit + examples)
        env:
          LD_LIBRARY_PATH: /opt/duckdb/lib
          DYLD_LIBRARY_PATH: /opt/duckdb/lib
        run: php tests/harness.php --no-color --junit=junit.xml

      - name: Capture core backtrace on Linux failure
        if: failure() && runner.os == 'Linux'
        continue-on-error: true
        env:
          LD_LIBRARY_PATH: /opt/duckdb/lib
        run: |
          sudo apt-get install -y gdb
          ulimit -c unlimited
          sudo sysctl -w kernel.core_pattern=/tmp/core.%p
          FAILING_PHPT=$(ls -t tests/*.diff 2>/dev/null | head -1 | sed 's/\.diff$/.phpt/')
          if [ -n "$FAILING_PHPT" ]; then
            PHP_BIN=$(which php)
            gdb -batch -ex run -ex "bt 30" \
              --args "$PHP_BIN" -d extension="$GITHUB_WORKSPACE/modules/duckdb.so" \
              run-tests.php -q "$FAILING_PHPT" 2>&1 | tail -60 || true
          fi

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-failures-${{ matrix.os }}-php${{ matrix.php }}
          path: |
            tests/*.diff
            tests/*.out
            tests/*.exp
            tests/*.log
            junit.xml
          if-no-files-found: ignore

  extended:
    name: Swoole + Valgrind + stress (PHP 8.4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          # Swoole is installed by setup-php, not by a bare pecl call:
          # pecl run as the runner user no longer has write access to
          # php_dir on current ubuntu-latest images ("Cannot install,
          # php_dir for channel pecl.php.net is not writeable").
          extensions: ffi, swoole

      - name: Install libduckdb
        run: |
          curl -sL "https://github.com/duckdb/duckdb/releases/download/v1.5.5/libduckdb-linux-amd64.zip" -o /tmp/libduckdb.zip
          sudo mkdir -p /opt/duckdb/include /opt/duckdb/lib
          sudo unzip -o /tmp/libduckdb.zip -d /opt/duckdb
          sudo mv /opt/duckdb/duckdb.h /opt/duckdb/include/
          sudo mv /opt/duckdb/libduckdb.* /opt/duckdb/lib/

      - name: Install Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind

      - name: Harness (build + unit + Swoole examples)
        env:
          LD_LIBRARY_PATH: /opt/duckdb/lib
        run: php tests/harness.php --no-color --junit=junit.xml

      - name: Valgrind
        env:
          LD_LIBRARY_PATH: /opt/duckdb/lib
          USE_ZEND_ALLOC: '0'
        run: php tests/harness.php --valgrind --no-color

      - name: Stress
        env:
          LD_LIBRARY_PATH: /opt/duckdb/lib
        run: php tests/harness.php --stress --no-color

      # TEMPORARY DIAGNOSTIC — remove once the Swoole shutdown SIGSEGV
      # (unit/049_swoole.phpt + examples/swoole.php exiting 139 after
      # printing all expected output) is root-caused. Runs only when an
      # earlier step failed. Captures gdb backtraces and core dumps for
      # the two crashing scenarios plus a pure-Swoole and a pure-DuckDB
      # control, so we can tell where the fault lives.
      - name: Capture Swoole crash backtrace (diagnostic)
        if: failure()
        env:
          LD_LIBRARY_PATH: /opt/duckdb/lib
        run: |
          set +e
          sudo apt-get update -qq >/dev/null 2>&1
          sudo apt-get install -y gdb >/dev/null 2>&1
          gdb --version | head -1

          echo '===== environment ====='
          uname -a
          ldd --version | head -1
          nproc
          php -v | head -1
          php -m | tr '\n' ' '; echo
          php --ri swoole 2>/dev/null | sed -n '1,45p'
          php --ri duckdb 2>/dev/null | sed -n '1,15p'

          # Core dumps into the workspace, as a fallback if the crash
          # refuses to reproduce under gdb.
          ulimit -c unlimited
          echo "$PWD/core.%e.%p" | sudo tee /proc/sys/kernel/core_pattern
          cat /proc/sys/kernel/core_pattern

          # --- scenario scripts -------------------------------------------
          # The Swoole child scenario, extracted verbatim from the phpt
          # (the crash happens in that proc_open'd subprocess).
          cat > /tmp/extract_child.php <<'EXTRACT_EOF'
          <?php
          $t = file_get_contents('tests/049_swoole.phpt');
          if (!preg_match('/\$script = <<<\'PHP\'\n(.*?)\nPHP;/s', $t, $m)) {
              fwrite(STDERR, "could not extract child script\n");
              exit(1);
          }
          file_put_contents('/tmp/swoole_child.php', "<?php\n" . $m[1]);
          echo "extracted ", strlen($m[1]), " bytes of child scenario\n";
          EXTRACT_EOF
          php /tmp/extract_child.php

          # Control 1: Swoole coroutines only, no duckdb loaded (-n).
          cat > /tmp/swoole_only.php <<'CTRL_EOF'
          <?php
          use Swoole\Coroutine;
          use function Swoole\Coroutine\run;
          run(function () {
              $ticks = 0;
              $t = Coroutine::create(function () use (&$ticks) {
                  for ($i = 0; $i < 200; $i++) { Coroutine::sleep(0.001); $ticks++; }
              });
              $w = Coroutine::create(function () { Coroutine::sleep(0.1); });
              Coroutine::join([$t, $w]);
              echo "swoole-only ok ($ticks ticks)\n";
          });
          CTRL_EOF

          # Control 2: duckdb async only, no swoole loaded (-n).
          cat > /tmp/duckdb_only.php <<'CTRL_EOF'
          <?php
          use DuckDB\Database;
          $db = new Database(':memory:');
          for ($i = 0; $i < 5; $i++) {
              $p = $db->connect()->queryAsync('SELECT sum(t1.range) FROM range(2000000) t1, range(20) t2');
              var_dump($p->await()->fetchAll(DuckDB\FetchMode::Num)[0][0]);
          }
          echo "duckdb-only ok\n";
          CTRL_EOF

          # --- phase 1: plain runs (fast, core dumps enabled) -------------
          echo '===== phase 1: plain runs ====='
          # A curl-native swoole build needs ext-curl loaded even with -n.
          EXTDIR=$(php-config --extension-dir)
          CURL_ARG=()
          [ -f "$EXTDIR/curl.so" ] && CURL_ARG=(-d "extension=$EXTDIR/curl.so")
          for i in $(seq 1 15); do
              php -d extension=$PWD/modules/duckdb.so -d swoole.hook_flags=0 /tmp/swoole_child.php >/dev/null 2>&1
              rc=$?; [ $rc -ne 0 ] && echo "049-child run $i: exit $rc"
              php -d extension=$PWD/modules/duckdb.so examples/swoole.php >/dev/null 2>&1
              rc=$?; [ $rc -ne 0 ] && echo "example run $i: exit $rc"
          done
          for i in $(seq 1 10); do
              php -n "${CURL_ARG[@]}" -d extension=$EXTDIR/swoole.so /tmp/swoole_only.php >/dev/null 2>&1
              rc=$?; [ $rc -ne 0 ] && echo "swoole-only run $i: exit $rc"
              php -n -d extension=$PWD/modules/duckdb.so /tmp/duckdb_only.php >/dev/null 2>&1
              rc=$?; [ $rc -ne 0 ] && echo "duckdb-only run $i: exit $rc"
          done
          echo 'phase 1 done'

          # --- phase 2: under gdb ------------------------------------------
          echo '===== phase 2: gdb runs ====='
          cat > /tmp/gdb.cmds <<'GDB_EOF'
          set pagination off
          handle SIGPIPE SIGUSR1 SIGUSR2 SIGCHLD nostop noprint pass
          run
          bt 40
          thread apply all bt 25
          info sharedlibrary
          GDB_EOF
          run_gdb() {
              local label="$1"; shift
              for i in $(seq 1 15); do
                  gdb -batch -x /tmp/gdb.cmds --args "$@" > /tmp/gdb_out.log 2>&1
                  if grep -qE 'SIGSEGV|SIGABRT' /tmp/gdb_out.log; then
                      echo "!!! CRASH REPRODUCED: $label run $i"
                      cat /tmp/gdb_out.log
                      return 0
                  fi
              done
              echo "no crash under gdb for: $label"
          }
          run_gdb "049-child" php -d extension=$PWD/modules/duckdb.so -d swoole.hook_flags=0 /tmp/swoole_child.php
          run_gdb "example"   php -d extension=$PWD/modules/duckdb.so examples/swoole.php

          # --- phase 3: backtraces from any core dumps ---------------------
          echo '===== phase 3: core dumps ====='
          for c in core.php.*; do
              [ -f "$c" ] || continue
              echo "=== core: $c ==="
              gdb -batch -ex 'set pagination off' -ex 'bt 40' \
                  -ex 'thread apply all bt 25' -ex 'info sharedlibrary' \
                  "$(command -v php)" "$c" 2>&1 | tail -120
          done
          echo '===== diagnostic step done ====='
          exit 0

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: extended-failures
          path: |
            tests/*.diff
            tests/*.out
            tests/*.exp
            tests/*.log
            junit.xml
          if-no-files-found: ignore

  amphp:
    name: Amp async (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ffi
          tools: composer

      - name: Install libduckdb
        run: |
          curl -sL "https://github.com/duckdb/duckdb/releases/download/v1.5.5/libduckdb-linux-amd64.zip" -o /tmp/libduckdb.zip
          sudo mkdir -p /opt/duckdb/include /opt/duckdb/lib
          sudo unzip -o /tmp/libduckdb.zip -d /opt/duckdb
          sudo mv /opt/duckdb/duckdb.h /opt/duckdb/include/
          sudo mv /opt/duckdb/libduckdb.* /opt/duckdb/lib/

      - name: Install Amp
        run: |
          mkdir -p /tmp/amphp
          cd /tmp/amphp
          composer require amphp/amp:^3.0 --no-interaction --quiet

      - name: Harness (unit + Amp examples)
        env:
          LD_LIBRARY_PATH: /opt/duckdb/lib
          DUCKDB_AMPHP_AUTOLOAD: /tmp/amphp/vendor/autoload.php
        run: php tests/harness.php --no-color --junit=junit.xml

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: amphp-failures-php${{ matrix.php }}
          path: |
            tests/*.diff
            tests/*.out
            tests/*.exp
            tests/*.log
            junit.xml
          if-no-files-found: ignore

  reactphp:
    name: ReactPHP async (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ffi
          tools: composer

      - name: Install libduckdb
        run: |
          curl -sL "https://github.com/duckdb/duckdb/releases/download/v1.5.5/libduckdb-linux-amd64.zip" -o /tmp/libduckdb.zip
          sudo mkdir -p /opt/duckdb/include /opt/duckdb/lib
          sudo unzip -o /tmp/libduckdb.zip -d /opt/duckdb
          sudo mv /opt/duckdb/duckdb.h /opt/duckdb/include/
          sudo mv /opt/duckdb/libduckdb.* /opt/duckdb/lib/

      - name: Install ReactPHP
        run: |
          mkdir -p /tmp/reactphp
          cd /tmp/reactphp
          composer require react/async:^4.0 --no-interaction --quiet

      - name: Harness (unit + ReactPHP examples)
        env:
          LD_LIBRARY_PATH: /opt/duckdb/lib
          DUCKDB_REACTPHP_AUTOLOAD: /tmp/reactphp/vendor/autoload.php
        run: php tests/harness.php --no-color --junit=junit.xml

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reactphp-failures-php${{ matrix.php }}
          path: |
            tests/*.diff
            tests/*.out
            tests/*.exp
            tests/*.log
            junit.xml
          if-no-files-found: ignore

  true-async:
    name: True-async (PHP 8.6)
    runs-on: ubuntu-latest
    container: trueasync/php-true-async:0.7.13-php8.6
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools and libduckdb
        shell: bash
        run: |
          set -eux
          apt-get update
          apt-get install -y build-essential autoconf pkg-config unzip curl git gdb
          curl -sL "https://github.com/duckdb/duckdb/releases/download/v1.5.5/libduckdb-linux-amd64.zip" -o /tmp/libduckdb.zip
          mkdir -p /opt/duckdb/include /opt/duckdb/lib
          unzip -o /tmp/libduckdb.zip -d /opt/duckdb
          mv /opt/duckdb/duckdb.h /opt/duckdb/include/
          mv /opt/duckdb/libduckdb.* /opt/duckdb/lib/

      - name: Harness (build + unit + true-async examples)
        shell: bash
        env:
          LD_LIBRARY_PATH: /opt/duckdb/lib
        run: php tests/harness.php --no-color --junit=junit.xml

      - name: Capture core backtrace on failure
        if: failure()
        continue-on-error: true
        shell: bash
        env:
          LD_LIBRARY_PATH: /opt/duckdb/lib
        run: |
          ulimit -c unlimited
          sysctl -w kernel.core_pattern=/tmp/core.%p || true
          FAILING_PHPT=$(ls -t tests/*.diff 2>/dev/null | head -1 | sed 's/\.diff$/.phpt/')
          if [ -n "$FAILING_PHPT" ]; then
            PHP_BIN=$(which php)
            gdb -batch -ex run -ex "bt 30" \
              --args "$PHP_BIN" -d extension="$GITHUB_WORKSPACE/modules/duckdb.so" \
              run-tests.php -q "$FAILING_PHPT" 2>&1 | tail -60 || true
          fi

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: true-async-failures
          path: |
            tests/*.diff
            tests/*.out
            tests/*.exp
            tests/*.log
            junit.xml
          if-no-files-found: ignore

  frankenphp:
    name: FrankenPHP worker mode (ZTS, PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    # The builder images ship the exact ZTS PHP that FrankenPHP embeds,
    # plus phpize/php-config and the frankenphp binary.
    container: dunglas/frankenphp:builder-php${{ matrix.php }}
    steps:
      - uses: actions/checkout@v4

      - name: Install libduckdb
        shell: bash
        run: |
          set -eux
          apt-get update
          apt-get install -y unzip curl git
          curl -sL "https://github.com/duckdb/duckdb/releases/download/v1.5.5/libduckdb-linux-amd64.zip" -o /tmp/libduckdb.zip
          mkdir -p /opt/duckdb/include /opt/duckdb/lib
          unzip -o /tmp/libduckdb.zip -d /opt/duckdb
          mv /opt/duckdb/duckdb.h /opt/duckdb/include/
          mv /opt/duckdb/libduckdb.* /opt/duckdb/lib/

      - name: Harness (ZTS build + unit + examples)
        shell: bash
        env:
          LD_LIBRARY_PATH: /opt/duckdb/lib
        run: php tests/harness.php --no-color --junit=junit.xml

      # Serve examples/frankenphp.php in worker mode, hammer it, then
      # SIGTERM: a clean exit proves no in-flight async worker outlives
      # module unload (test 065's race, end to end).
      - name: Worker-mode smoke test
        shell: bash
        env:
          LD_LIBRARY_PATH: /opt/duckdb/lib
        run: |
          set -eux
          cd examples
          mkdir -p /tmp/fpini
          printf 'extension=%s/modules/duckdb.so\n' "$GITHUB_WORKSPACE" > /tmp/fpini/php.ini
          PHPRC=/tmp/fpini frankenphp run --config frankenphp.Caddyfile &
          FP_PID=$!
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:8080/ && break || sleep 1
          done
          seq 1 200 | xargs -P 16 -I{} curl -sf http://localhost:8080/ -o /dev/null
          kill -TERM $FP_PID
          wait $FP_PID

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frankenphp-failures-php${{ matrix.php }}
          path: |
            tests/*.diff
            tests/*.out
            tests/*.exp
            tests/*.log
            junit.xml
          if-no-files-found: ignore
