name: Docker

on:
  push:
    branches: [master]
    tags: ['v*', '[0-9]*']
  pull_request:

env:
  DEFAULT_PHP: '8.5'

jobs:
  docker-tags:
    name: Docker tag tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/tests/test_docker_tags.py

  docker:
    name: Docker php${{ matrix.php }} (amd64 + arm64)
    runs-on: ubuntu-latest
    needs: docker-tags
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        shell: bash
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          PHP_VERSION: ${{ matrix.php }}
          VARIANT: ""
        run: |
          set -euo pipefail
          tags=$(bash .github/scripts/docker-tags.sh)
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      # The Dockerfile runs its smoke test inside the build for BOTH
      # platforms, so a failing arm64 build fails here. On pull requests
      # nothing is pushed; the build + in-build smoke test still runs.
      - name: Build multi-arch image (publish on master/tags)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            PHP_VERSION=${{ matrix.php }}
          cache-from: type=gha,scope=php-duckdb-${{ matrix.php }}
          cache-to: type=gha,mode=max,scope=php-duckdb-${{ matrix.php }}

  docker-zts:
    name: Docker php${{ matrix.php }}-frankenphp ZTS (amd64 + arm64)
    runs-on: ubuntu-latest
    needs: docker-tags
    strategy:
      fail-fast: false
      matrix:
        # ZTS builds matter for FrankenPHP; the frankenphp CI job covers
        # 8.4 + 8.5, so the published ZTS images track the same set.
        php: ['8.4', '8.5']
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        shell: bash
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          PHP_VERSION: ${{ matrix.php }}
          VARIANT: "frankenphp"
        run: |
          set -euo pipefail
          tags=$(bash .github/scripts/docker-tags.sh)
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      # Dockerfile.frankenphp compiles against the builder image's
      # embedded ZTS PHP and runs its smoke test inside the build for
      # BOTH platforms. On pull requests nothing is pushed; the build +
      # in-build smoke test still runs.
      - name: Build multi-arch ZTS image (publish on master/tags)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frankenphp
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            PHP_VERSION=${{ matrix.php }}
          cache-from: type=gha,scope=php-duckdb-frankenphp-${{ matrix.php }}
          cache-to: type=gha,mode=max,scope=php-duckdb-frankenphp-${{ matrix.php }}
