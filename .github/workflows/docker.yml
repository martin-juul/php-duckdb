name: Docker

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

jobs:
  docker:
    name: Docker php${{ matrix.php }} (amd64 + arm64)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          TAGS="ghcr.io/${{ github.repository }}:${{ matrix.php }}"
          # latest tracks the newest supported PHP version
          if [ "${{ matrix.php }}" = "8.5" ]; then
            TAGS="${TAGS},ghcr.io/${{ github.repository }}:latest"
          fi
          # Release tags (v1.2.3) additionally publish 1.2.3-php8.4 style tags
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAGS="${TAGS},ghcr.io/${{ github.repository }}:${GITHUB_REF_NAME#v}-php${{ matrix.php }}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      # The Dockerfile runs its smoke test inside the build for BOTH
      # platforms, so a failing arm64 build fails here. On pull requests
      # nothing is pushed; the build + in-build smoke test still runs.
      - name: Build multi-arch image (publish on master/tags)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            PHP_VERSION=${{ matrix.php }}
          cache-from: type=gha,scope=php-duckdb-${{ matrix.php }}
          cache-to: type=gha,mode=max,scope=php-duckdb-${{ matrix.php }}
