name: Docker

on:
  push:
    branches: [master]
    tags: ['v*', '[0-9]*']
  pull_request:

env:
  DEFAULT_PHP: '8.5'

jobs:
  docker-tags:
    name: Docker tag and manifest tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/tests/test_docker_tags.py
      - run: python3 .github/tests/test_docker_manifest.py

  docker:
    name: Docker php${{ matrix.php }}${{ matrix.variant && '-frankenphp' || '' }} (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    needs: docker-tags
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        variant: ['', 'frankenphp']
        arch: ['amd64', 'arm64']
        exclude:
          - php: '8.2'
            variant: frankenphp
          - php: '8.3'
            variant: frankenphp
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image name
        id: image
        shell: bash
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          echo "name=${IMAGE,,}" >> "$GITHUB_OUTPUT"

      - name: Login to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Both Dockerfiles run build-stage and final-image smoke tests. Each
      # architecture runs natively, including on pull requests without pushing.
      - name: Build and smoke-test pull request image
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.variant == 'frankenphp' && 'Dockerfile.frankenphp' || 'Dockerfile' }}
          platforms: linux/${{ matrix.arch }}
          push: false
          build-args: |
            PHP_VERSION=${{ matrix.php }}
          cache-from: type=gha,scope=php-duckdb-${{ matrix.php }}-${{ matrix.variant || 'cli' }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=php-duckdb-${{ matrix.php }}-${{ matrix.variant || 'cli' }}-${{ matrix.arch }}

      # Publish only immutable digests here. Tags are assigned after every
      # image and architecture has built successfully.
      - name: Build and push image digest
        if: github.event_name != 'pull_request'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.variant == 'frankenphp' && 'Dockerfile.frankenphp' || 'Dockerfile' }}
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            PHP_VERSION=${{ matrix.php }}
          cache-from: type=gha,scope=php-duckdb-${{ matrix.php }}-${{ matrix.variant || 'cli' }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=php-duckdb-${{ matrix.php }}-${{ matrix.variant || 'cli' }}-${{ matrix.arch }}

      - name: Export image digest
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          if [[ ! "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Invalid image digest: $DIGEST" >&2
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/digests"
          printf '%s\n' "$DIGEST" > "$RUNNER_TEMP/digests/$ARCH.digest"

      - name: Upload image digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digests-php${{ matrix.php }}-${{ matrix.variant || 'cli' }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/${{ matrix.arch }}.digest
          if-no-files-found: error
          retention-days: 1

  docker-manifest:
    name: Publish php${{ matrix.php }}${{ matrix.variant && '-frankenphp' || '' }} manifests
    if: github.event_name != 'pull_request'
    needs: docker
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        variant: ['', 'frankenphp']
        exclude:
          - php: '8.2'
            variant: frankenphp
          - php: '8.3'
            variant: frankenphp
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Download architecture digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-php${{ matrix.php }}-${{ matrix.variant || 'cli' }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-platform tags
        shell: bash
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          PHP_VERSION: ${{ matrix.php }}
          VARIANT: ${{ matrix.variant }}
        run: bash .github/scripts/docker-manifest.sh "$RUNNER_TEMP/digests"
